<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KeyForge 3D</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KeyForge 3D">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><circle cx='35' cy='50' r='18' fill='none' stroke='%2310b981' stroke-width='8'/><path d='M53 50 H85 M70 50 V65 M82 50 V65' stroke='%2310b981' stroke-width='8' stroke-linecap='round'/></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        :root {
            --primary: #059669; --primary-dark: #047857; --primary-light: #10b981;
            --bg-dark: #0f172a; --bg-card: #1e293b; --surface: #ffffff;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #334155;
            --error: #ef4444; --success: #22c55e;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh; overflow: hidden; position: fixed; width: 100%; height: 100%;
        }
        .app-container {
            display: flex; flex-direction: column; height: 100vh; height: 100dvh;
            width: 100vw; max-width: 100%; position: relative; overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }
        .header {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
            padding: 12px 16px; border-bottom: 1px solid rgba(5, 150, 105, 0.3);
            z-index: 20; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 {
            font-size: 1.35rem; font-weight: 700;
            background: linear-gradient(135deg, #10b981, #34d399); -webkit-background-clip: text;
            background-clip: text; color: transparent; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;
        }
        .header p { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
        #installAppBtn {
            background: rgba(16, 185, 129, 0.2); color: var(--primary-light);
            border: 1px solid var(--primary); padding: 6px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; cursor: pointer;
        }
        .canvas-wrapper {
            flex: 1; position: relative; min-height: 0; background: rgba(0, 0, 0, 0.2);
            margin: 8px 12px; border-radius: 24px; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); cursor: grab;
        }
        .canvas-wrapper:active { cursor: grabbing; }
        #canvas-container { width: 100%; height: 100%; touch-action: none; }
        .controls-panel {
            background: rgba(30, 41, 59, 0.96); backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(5, 150, 105, 0.3); flex-shrink: 0;
            max-height: 60vh; overflow-y: auto; z-index: 15;
        }
        .controls-panel::-webkit-scrollbar { width: 3px; }
        .controls-panel::-webkit-scrollbar-track { background: var(--border); border-radius: 10px; }
        .controls-panel::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        label {
            display: flex; justify-content: space-between; align-items: baseline; font-size: 0.7rem;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .value-display {
            color: var(--primary-light); font-weight: 700; background: rgba(5, 150, 105, 0.2);
            padding: 2px 8px; border-radius: 20px; font-size: 0.65rem;
        }
        input[type="text"] {
            width: 100%; padding: 11px 14px; background: var(--bg-dark); border: 1.5px solid var(--border);
            border-radius: 14px; font-size: 0.95rem; color: var(--text-primary); font-weight: 500;
            transition: all 0.2s ease; -webkit-appearance: none; user-select: text; -webkit-user-select: text;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2); }
        input[type="range"] {
            width: 100%; height: 5px; -webkit-appearance: none; background: var(--border);
            border-radius: 10px; outline: none; margin-top: 8px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; background: var(--primary);
            border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--surface); transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.15); }
        select, .btn-secondary {
            width: 100%; background: var(--bg-dark); color: var(--text-primary);
            border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px;
            font-size: 0.85rem; outline: none; cursor: pointer; font-weight: 600;
        }
        select:focus { border-color: var(--primary); }
        .btn-secondary {
            background: rgba(16, 185, 129, 0.1); border-color: var(--primary); color: var(--primary-light);
            text-align: center; display: inline-block; padding: 11px 14px; margin-top: 2px;
        }
        .btn-primary {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; padding: 14px; border-radius: 18px; font-size: 0.95rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            transition: all 0.15s ease; margin-top: 8px; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
        }
        .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3); }
        .btn-primary:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
        .overlay-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); padding: 12px 24px;
            border-radius: 40px; color: white; font-weight: 600; z-index: 30; display: flex;
            align-items: center; gap: 12px; border: 1px solid rgba(5, 150, 105, 0.5); font-size: 0.85rem;
        }
        .spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #error-box { background: rgba(239, 68, 68, 0.95); border: 1px solid rgba(239, 68, 68, 0.5); }
        .hidden { display: none !important; }
        .badge {
            display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(5, 150, 105, 0.15);
            padding: 6px 12px; border-radius: 30px; font-size: 0.65rem; color: var(--primary-light); margin-top: 10px;
        }
        @media (max-width: 380px) {
            .controls-panel { padding: 12px 12px 16px; max-height: 52vh; }
            .btn-primary { padding: 12px; font-size: 0.85rem; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/TTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
    <script src="https://unpkg.com/clipper-lib@1.0.0/clipper.js"></script>
    <script src="https://unpkg.com/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
    <script src="fonte_customizada.js"></script>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>🔑 KeyForge 3D</h1>
            <p>Gerador 2D para 3D e Textos</p>
        </div>
        <button id="installAppBtn" class="hidden">📲 Instalar App</button>
    </div>

    <div class="canvas-wrapper">
        <div id="canvas-container"></div>
        <div id="loading" class="overlay-message hidden">
            <div class="spinner"></div>
            <span id="loadingText">Processando Malha 3D...</span>
        </div>
        <div id="error-box" class="overlay-message hidden"></div>
    </div>
    
    <div class="controls-panel">
        
        <div class="form-row" style="background: rgba(5, 150, 105, 0.1); padding: 10px; border-radius: 14px; margin-bottom: 16px; border: 1px solid rgba(5, 150, 105, 0.3);">
            <div class="form-group" style="margin-bottom: 0;">
                <label style="color: var(--primary-light); margin-bottom: 8px;">🛠️ Modo Criação</label>
                <select id="modeSelect">
                    <option value="text">✍️ Texto</option>
                    <option value="image">🖼️ Imagem</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label style="color: var(--primary-light); margin-bottom: 8px;">🔗 Argola</label>
                <select id="ringPositionSelect">
                    <option value="top">⬆️ Topo</option>
                    <option value="left" selected>⬅️ Esquerda</option>
                    <option value="right">➡️ Direita</option>
                    <option value="bottom">⬇️ Fundo</option>
                </select>
            </div>
        </div>

        <div id="textGroup" class="form-row">
            <div class="form-group" style="flex: 1.3;">
                <label><span>📝 Nome</span><span class="value-display">máx 20</span></label>
                <input type="text" id="nameInput" value="Chaveiro3D" maxlength="20" autocomplete="off">
            </div>
            <div class="form-group" style="flex: 1;">
                <label><span>🔤 Fonte</span></label>
                <select id="fontSelect">
                    <option value="chewy">Chewy (Divertida)</option>
                    <option value="montserrat">Montserrat (Moderna)</option>
                    <option value="pacifico">Pacifico (Cursiva)</option>
                    <option value="bungee">Bungee (Gamer/Forte)</option>
                    <option value="helvetiker">Helvetiker (Clássica)</option>
                    <option value="custom_file">📂 Arquivo .TTF...</option>
                </select>
                <input type="file" id="customFontInput" accept=".ttf,.otf" class="hidden">
            </div>
        </div>

        <div id="imageGroup" class="hidden">
            <div class="form-group">
                <label><span>📂 Arquivo (JPG, PNG, SVG)</span></label>
                <input type="file" id="imageInput" accept=".jpg,.jpeg,.png,.svg" class="hidden">
                <div id="uploadImageBtn" class="btn-secondary">
                    <span id="imageBtnText">Toque para selecionar imagem</span>
                </div>
            </div>
            <div class="form-group">
                <label>🎚️ Filtro de Contraste <span id="thresholdValue" class="value-display">128</span></label>
                <input type="range" id="thresholdSlider" min="1" max="254" step="1" value="128">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>📏 Comprimento <span id="lengthValue" class="value-display">60mm</span></label>
                <input type="range" id="lengthSlider" min="20" max="150" step="1" value="60">
            </div>
            <div class="form-group">
                <label>🔄 Borda <span id="thicknessValue" class="value-display">1.5mm</span></label>
                <input type="range" id="thicknessSlider" min="0.5" max="3.0" step="0.1" value="1.5">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>📦 Base (Z) <span id="baseThicknessValue" class="value-display">3.0mm</span></label>
                <input type="range" id="baseThicknessSlider" min="1.0" max="6.0" step="0.2" value="3.0">
            </div>
            <div class="form-group">
                <label>✨ Relevo <span id="textThicknessValue" class="value-display">1.5mm</span></label>
                <input type="range" id="textThicknessSlider" min="0.5" max="2.0" step="0.1" value="1.5">
            </div>
        </div>

        <div class="form-group">
            <select id="exportMode">
                <option value="multi">Multicolor (Baixar 2 STLs separados)</option>
                <option value="single">Cor Única (Baixar 1 STL mesclado)</option>
            </select>
        </div>
        
        <button id="downloadBtn" class="btn-primary" disabled>📥 Exportar Arquivo(s)</button>
        <div class="badge"><span>🎯</span> Arraste para girar | Dois dedos para zoom</div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }

    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installAppBtn.classList.remove('hidden');
    });

    installAppBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installAppBtn.classList.add('hidden');
            deferredPrompt = null;
        }
    });

    (function(){
        let scene, camera, renderer, controls, baseMesh, textMesh;
        let loadedFont = null, globalShapes = [], debounceTimer, rasterDebounce, uploadedImageObj = null;

        const fontCache = {}; 
        const FONT_URLS = {
            montserrat: { type: 'ttf', url: 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-Black.ttf' },
            pacifico:   { type: 'ttf', url: 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/pacifico/Pacifico-Regular.ttf' },
            bungee:     { type: 'ttf', url: 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/bungee/Bungee-Regular.ttf' },
            helvetiker: { type: 'json', url: 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json' }
        };

        const modeSelect = document.getElementById('modeSelect');
        const ringPositionSelect = document.getElementById('ringPositionSelect');
        const textGroup = document.getElementById('textGroup');
        const fontSelect = document.getElementById('fontSelect');
        const customFontInput = document.getElementById('customFontInput');
        
        const imageGroup = document.getElementById('imageGroup');
        const imageInput = document.getElementById('imageInput');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const imageBtnText = document.getElementById('imageBtnText');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');

        const nameInput = document.getElementById('nameInput');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const thicknessSlider = document.getElementById('thicknessSlider');
        const thicknessValue = document.getElementById('thicknessValue');
        const baseThicknessSlider = document.getElementById('baseThicknessSlider');
        const baseThicknessValue = document.getElementById('baseThicknessValue');
        const textThicknessSlider = document.getElementById('textThicknessSlider');
        const textThicknessValue = document.getElementById('textThicknessValue');
        const exportMode = document.getElementById('exportMode');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const errorBox = document.getElementById('error-box');
        
        let isGenerating = false;
        let lastSelectedFont = 'chewy';
        
        function showLoading(show, customMsg = "Processando Malha 3D...") {
            if(show) {
                loadingText.innerText = customMsg;
                loadingDiv.classList.remove('hidden');
                errorBox.classList.add('hidden');
                isGenerating = true;
                downloadBtn.disabled = true;
            } else {
                loadingDiv.classList.add('hidden');
                isGenerating = false;
                downloadBtn.disabled = false;
            }
        }
        
        function showError(message) {
            loadingDiv.classList.add('hidden');
            errorBox.innerText = `⚠️ ${message}`;
            errorBox.classList.remove('hidden');
            isGenerating = false;
            downloadBtn.disabled = true;
            setTimeout(() => {
                if(!errorBox.classList.contains('hidden')) errorBox.classList.add('hidden');
            }, 4000);
        }
        
        function initThree() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.006);
            camera = new THREE.PerspectiveCamera(42, width / height, 0.5, 500);
            camera.position.set(0, -50, 60);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.06;
            controls.target.set(0, 0, 2);
            scene.add(new THREE.AmbientLight(0x404060));
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.1);
            mainLight.position.set(12, 22, 18); mainLight.castShadow = true;
            scene.add(mainLight);
            scene.add(new THREE.PointLight(0x4488cc, 0.45, 0, 0));
            scene.add(new THREE.PointLight(0xffaa66, 0.35, 0, 0));
            const grid = new THREE.GridHelper(120, 20, 0x334155, 0x1e293b);
            grid.position.y = -12; grid.material.opacity = 0.2; grid.material.transparent = true;
            scene.add(grid);
            window.addEventListener('resize', onWindowResize);
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if(!container || !camera || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        modeSelect.addEventListener('change', () => {
            if (modeSelect.value === 'text') {
                textGroup.classList.remove('hidden');
                imageGroup.classList.add('hidden');
                triggerGeneration();
            } else {
                textGroup.classList.add('hidden');
                imageGroup.classList.remove('hidden');
                if (uploadedImageObj) {
                    processRaster(uploadedImageObj);
                } else {
                    if(baseMesh) { scene.remove(baseMesh); baseMesh = null; }
                    if(textMesh) { scene.remove(textMesh); textMesh = null; }
                    globalShapes = [];
                    downloadBtn.disabled = true;
                }
            }
        });

        uploadImageBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            imageBtnText.innerText = "⭐ " + file.name;
            showLoading(true, "Analisando Imagem...");
            
            const reader = new FileReader();
            reader.onload = function(event) {
                if (file.type.includes('svg')) {
                    uploadedImageObj = null;
                    processSVG(event.target.result);
                } else {
                    const img = new Image();
                    img.onload = () => {
                        uploadedImageObj = img;
                        processRaster(img);
                    };
                    img.src = event.target.result;
                }
            };
            if(file.type.includes('svg')) reader.readAsText(file);
            else reader.readAsDataURL(file);
        });

        thresholdSlider.addEventListener('input', () => {
            thresholdValue.innerText = thresholdSlider.value;
            if(modeSelect.value === 'image' && uploadedImageObj) {
                if(rasterDebounce) clearTimeout(rasterDebounce);
                rasterDebounce = setTimeout(() => {
                    showLoading(true, "Ajustando Contraste...");
                    processRaster(uploadedImageObj);
                }, 300);
            }
        });

        function processRaster(img) {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxSize = 400; 
                let w = img.width, h = img.height;
                if (w > maxSize || h > maxSize) {
                    const ratio = Math.min(maxSize/w, maxSize/h);
                    w *= ratio; h *= ratio;
                }
                w = Math.floor(w); h = Math.floor(h);
                canvas.width = w; canvas.height = h;
                
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                
                const thresh = parseInt(thresholdSlider.value);
                const imgData = ctx.getImageData(0, 0, w, h);
                for(let i = 0; i < imgData.data.length; i += 4) {
                    const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2], a = imgData.data[i+3];
                    const lum = 0.2126*r + 0.7152*g + 0.0722*b;
                    if (a > 128 && lum < thresh) {
                        imgData.data[i]=0; imgData.data[i+1]=0; imgData.data[i+2]=0;
                    } else {
                        imgData.data[i]=255; imgData.data[i+1]=255; imgData.data[i+2]=255;
                    }
                    imgData.data[i+3] = 255;
                }
                
                const svgStr = ImageTracer.imagedataToSVG(imgData, {
                    ltres: 1, qtres: 1, pathomit: 8, colorsampling: 0, numberofcolors: 2, 
                    scale: 1, simplifytolerance: 0, roundcoords: 1, viewbox: true
                });
                
                processSVG(svgStr);
            } catch(e) {
                showError("Erro ao processar imagem.");
                showLoading(false);
            }
        }

        function processSVG(svgStr) {
            try {
                const loader = new THREE.SVGLoader();
                const svgData = loader.parse(svgStr);
                let tempShapes = [];
                svgData.paths.forEach(path => {
                    if (path.color.r > 0.8 && path.color.g > 0.8 && path.color.b > 0.8) return;
                    tempShapes.push(...path.toShapes(true));
                });
                
                if(tempShapes.length === 0) throw new Error("Aumente a Sensibilidade para detectar a imagem.");
                
                globalShapes = [];
                tempShapes.forEach(shape => {
                    const newShape = new THREE.Shape();
                    const pts = shape.extractPoints(12);
                    if(pts.shape.length > 2) {
                        newShape.moveTo(pts.shape[0].x, -pts.shape[0].y);
                        for(let i=1; i<pts.shape.length; i++) newShape.lineTo(pts.shape[i].x, -pts.shape[i].y);
                        pts.holes.forEach(hole => {
                            if(hole.length > 2) {
                                const newHole = new THREE.Path();
                                newHole.moveTo(hole[0].x, -hole[0].y);
                                for(let i=1; i<hole.length; i++) newHole.lineTo(hole[i].x, -hole[i].y);
                                newShape.holes.push(newHole);
                            }
                        });
                        globalShapes.push(newShape);
                    }
                });
                
                generateKeychain();
            } catch(e) {
                showError(e.message || "Formato ou imagem não reconhecida.");
                showLoading(false);
            }
        }
        
        async function generateKeychain() {
            let shapesToProcess = [];

            if (modeSelect.value === 'text') {
                if(!loadedFont) return;
                const textStr = nameInput.value.trim();
                if(textStr.length === 0) return;
                shapesToProcess = loadedFont.generateShapes(textStr, 10);
            } else {
                if (!globalShapes || globalShapes.length === 0) return;
                shapesToProcess = globalShapes;
            }

            showLoading(true, "Construindo STL...");
            await new Promise(r => setTimeout(r, 10));
            
            try {
                errorBox.classList.add('hidden');
                if(baseMesh) { scene.remove(baseMesh); if(baseMesh.geometry) baseMesh.geometry.dispose(); }
                if(textMesh) { scene.remove(textMesh); if(textMesh.geometry) textMesh.geometry.dispose(); }
                
                const clipperScale = 1000;
                const rawPaths = [];
                
                shapesToProcess.forEach(shape => {
                    const points = shape.extractPoints(8);
                    if (points.shape && points.shape.length > 2) {
                        rawPaths.push(points.shape.map(p => ({ X: Math.round(p.x * clipperScale), Y: Math.round(p.y * clipperScale) })));
                    }
                });

                const clPrep = new ClipperLib.Clipper();
                clPrep.AddPaths(rawPaths, ClipperLib.PolyType.ptSubject, true);
                const mergedPaths = new ClipperLib.Paths();
                clPrep.Execute(ClipperLib.ClipType.ctUnion, mergedPaths, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);

                const pathsToOffset = mergedPaths.length > 0 ? mergedPaths : rawPaths;
                
                // --- AJUSTE MATEMÁTICO DE ESCALA ---
                let rawMinX = Infinity, rawMaxX = -Infinity, rawMinY = Infinity, rawMaxY = -Infinity;
                pathsToOffset.forEach(path => path.forEach(p => {
                    rawMinX = Math.min(rawMinX, p.X); rawMaxX = Math.max(rawMaxX, p.X);
                    rawMinY = Math.min(rawMinY, p.Y); rawMaxY = Math.max(rawMaxY, p.Y);
                }));

                const rawWidthUnits = (rawMaxX - rawMinX) / clipperScale;
                const targetLengthMM = parseFloat(lengthSlider.value) || 60;
                const visualScale = rawWidthUnits > 0 ? (rawWidthUnits / targetLengthMM) : 1;
                
                const currentThickness = parseFloat(thicknessSlider.value) || 1.5;
                const offsetDist = currentThickness * visualScale * clipperScale;

                const co = new ClipperLib.ClipperOffset();
                co.AddPaths(pathsToOffset, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
                const offsetPaths = new ClipperLib.Paths();
                co.Execute(offsetPaths, offsetDist);
                
                if(!offsetPaths || offsetPaths.length === 0) throw new Error("Borda muito pequena ou imagem com falhas.");
                
                // --- LÓGICA DE EXTREMIDADES REAIS (CORREÇÃO DE FLUTUAÇÃO) ---
                let extLeft = offsetPaths[0][0], extRight = offsetPaths[0][0];
                let extTop = offsetPaths[0][0], extBottom = offsetPaths[0][0];
                let minX = extLeft.X, maxX = extRight.X, minY = extBottom.Y, maxY = extTop.Y;

                offsetPaths.forEach(path => path.forEach(p => { 
                    if (p.X < minX) { minX = p.X; extLeft = p; }
                    if (p.X > maxX) { maxX = p.X; extRight = p; }
                    if (p.Y < minY) { minY = p.Y; extBottom = p; }
                    if (p.Y > maxY) { maxY = p.Y; extTop = p; }
                }));
                
                const ringPos = ringPositionSelect.value;
                const ringRadius = 4.8 * visualScale * clipperScale;
                const holeRadius = 2.6 * visualScale * clipperScale;
                const overlap = 2.5 * visualScale * clipperScale; // Aumentado para reforçar a mordida da argola
                
                let cx, cy;
                if (ringPos === 'top') {
                    cx = extTop.X;
                    cy = maxY + ringRadius - overlap;
                } else if (ringPos === 'right') {
                    cx = maxX + ringRadius - overlap;
                    cy = extRight.Y;
                } else if (ringPos === 'bottom') {
                    cx = extBottom.X;
                    cy = minY - ringRadius + overlap;
                } else { // 'left'
                    cx = minX - ringRadius + overlap;
                    cy = extLeft.Y;
                }
                
                const ringOuter = [], ringInner = [];
                const segments = 40;
                for(let i = 0; i <= segments; i++) {
                    const a = (i / segments) * Math.PI * 2;
                    ringOuter.push({ X: Math.round(cx + Math.cos(a) * ringRadius), Y: Math.round(cy + Math.sin(a) * ringRadius) });
                    ringInner.push({ X: Math.round(cx + Math.cos(a) * holeRadius), Y: Math.round(cy + Math.sin(a) * holeRadius) });
                }
                
                const cl1 = new ClipperLib.Clipper();
                const unionPaths = new ClipperLib.Paths();
                cl1.AddPaths(offsetPaths, ClipperLib.PolyType.ptSubject, true);
                cl1.AddPaths([ringOuter], ClipperLib.PolyType.ptSubject, true);
                cl1.Execute(ClipperLib.ClipType.ctUnion, unionPaths, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
                
                const cl2 = new ClipperLib.Clipper();
                const finalTree = new ClipperLib.PolyTree();
                cl2.AddPaths(unionPaths, ClipperLib.PolyType.ptSubject, true);
                cl2.AddPaths([ringInner], ClipperLib.PolyType.ptClip, true);
                cl2.Execute(ClipperLib.ClipType.ctDifference, finalTree, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
                
                const getChilds = (node) => (typeof node.Childs === 'function') ? node.Childs() : (node.Childs || []);
                const getContour = (node) => (typeof node.Contour === 'function') ? node.Contour() : (node.Contour || []);
                
                const baseThreeShapes = [];
                const topNodes = getChilds(finalTree);
                for(let i = 0; i < topNodes.length; i++) {
                    const contour = getContour(topNodes[i]);
                    if(!contour || contour.length < 3) continue;
                    const shape = new THREE.Shape();
                    shape.moveTo(contour[0].X / clipperScale, contour[0].Y / clipperScale);
                    for(let k = 1; k < contour.length; k++) shape.lineTo(contour[k].X / clipperScale, contour[k].Y / clipperScale);
                    
                    const holeNodes = getChilds(topNodes[i]);
                    for(let j = 0; j < holeNodes.length; j++) {
                        const hContour = getContour(holeNodes[j]);
                        if(hContour && hContour.length > 2) {
                            const holePath = new THREE.Path();
                            holePath.moveTo(hContour[0].X / clipperScale, hContour[0].Y / clipperScale);
                            for(let k = 1; k < hContour.length; k++) holePath.lineTo(hContour[k].X / clipperScale, hContour[k].Y / clipperScale);
                            shape.holes.push(holePath);
                        }
                    }
                    baseThreeShapes.push(shape);
                }
                
                const currentBaseThickness = parseFloat(baseThicknessSlider.value) || 3.0;
                const baseGeo = new THREE.ExtrudeGeometry(baseThreeShapes, { depth: Math.max(0.2, currentBaseThickness - 0.7), bevelEnabled: true, bevelThickness: 0.7, bevelSize: 0.55 * visualScale, bevelSegments: 4, curveSegments: 8 });
                const textGeo = new THREE.ExtrudeGeometry(shapesToProcess, { depth: parseFloat(textThicknessSlider.value) || 1.5, bevelEnabled: false, curveSegments: 8 });
                
                baseGeo.computeBoundingBox();
                const originalWidth = baseGeo.boundingBox.max.x - baseGeo.boundingBox.min.x;
                const scaleFactor = (parseFloat(lengthSlider.value) || 60) / originalWidth;
                
                baseGeo.scale(scaleFactor, scaleFactor, 1);
                textGeo.scale(scaleFactor, scaleFactor, 1);
                textGeo.translate(0, 0, currentBaseThickness);
                
                baseGeo.computeBoundingBox();
                const centerX = -(baseGeo.boundingBox.max.x + baseGeo.boundingBox.min.x) / 2;
                const centerY = -(baseGeo.boundingBox.max.y + baseGeo.boundingBox.min.y) / 2;
                baseGeo.translate(centerX, centerY, 0);
                textGeo.translate(centerX, centerY, 0);
                
                baseMesh = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.45, metalness: 0.65 }));
                textMesh = new THREE.Mesh(textGeo, new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.35, metalness: 0.55 }));
                
                scene.add(baseMesh); scene.add(textMesh);
                showLoading(false);
                
            } catch(err) {
                showError(err.message || "Erro na geração. Ajuste as bordas.");
                showLoading(false);
            }
        }
        
        async function downloadSTLs() {
            if(!baseMesh || !textMesh || isGenerating) return;
            try {
                const exporter = new THREE.STLExporter();
                const safeName = (modeSelect.value === 'text' ? nameInput.value : 'imagem').trim().replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'keyforge';
                const mode = exportMode.value;
                
                const downloadFile = (stlData, filename) => {
                    const blob = new Blob([stlData], { type: 'application/vnd.ms-pki.stl' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url; link.download = filename;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 200);
                };
                
                downloadBtn.style.transform = 'scale(0.96)';
                setTimeout(() => { downloadBtn.style.transform = ''; }, 120);

                if (mode === 'multi') {
                    downloadFile(exporter.parse(baseMesh), `keyforge_base_${safeName}.stl`);
                    setTimeout(() => downloadFile(exporter.parse(textMesh), `keyforge_topo_${safeName}.stl`), 300);
                } else {
                    const group = new THREE.Group();
                    group.add(baseMesh.clone()); group.add(textMesh.clone());
                    downloadFile(exporter.parse(group), `keyforge_unificado_${safeName}.stl`);
                }
            } catch(e) { showError("Erro ao exportar STL"); }
        }
        
        function triggerGeneration() {
            if(debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => generateKeychain(), 250);
        }

        function switchFont(fontKey) {
            if (fontKey === 'custom_file') { customFontInput.click(); return; }
            if (fontCache[fontKey]) { loadedFont = fontCache[fontKey]; lastSelectedFont = fontKey; triggerGeneration(); return; }
            
            const fontConfig = FONT_URLS[fontKey];
            if (!fontConfig) return;

            showLoading(true, "Baixando Fonte...");
            const fontLoader = new THREE.FontLoader();
            
            let hasError = false;
            const onError = () => {
                hasError = true;
                showError("Rede falhou ao baixar a fonte. Voltando ao normal.");
                fontSelect.value = lastSelectedFont;
                showLoading(false);
            };

            if (fontConfig.type === 'json') {
                fontLoader.load(fontConfig.url, (font) => {
                    if(hasError) return;
                    fontCache[fontKey] = font; loadedFont = font; lastSelectedFont = fontKey;
                    showLoading(false); triggerGeneration();
                }, undefined, onError);
            } else if (fontConfig.type === 'ttf') {
                new THREE.TTFLoader().load(fontConfig.url, (json) => {
                    if(hasError) return;
                    const font = fontLoader.parse(json);
                    fontCache[fontKey] = font; loadedFont = font; lastSelectedFont = fontKey;
                    showLoading(false); triggerGeneration();
                }, undefined, onError);
            }
        }

        customFontInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) { fontSelect.value = lastSelectedFont; return; }
            showLoading(true, "Lendo fonte...");
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const font = new THREE.FontLoader().parse(new THREE.TTFLoader().parse(event.target.result));
                    const customKey = 'user_' + file.name;
                    fontCache[customKey] = font;
                    let opt = document.createElement('option');
                    opt.value = customKey; opt.innerText = "⭐ " + file.name.replace(/\.(ttf|otf)$/i, '');
                    fontSelect.insertBefore(opt, fontSelect.lastElementChild);
                    fontSelect.value = customKey; lastSelectedFont = customKey; loadedFont = font;
                    showLoading(false); triggerGeneration();
                } catch (err) { showError("Fonte inválida."); showLoading(false); fontSelect.value = lastSelectedFont; }
            };
            reader.readAsArrayBuffer(file);
        });
        
        nameInput.addEventListener('input', triggerGeneration);
        fontSelect.addEventListener('change', (e) => switchFont(e.target.value));
        ringPositionSelect.addEventListener('change', triggerGeneration);
        lengthSlider.addEventListener('input', () => { lengthValue.innerText = lengthSlider.value + 'mm'; triggerGeneration(); });
        thicknessSlider.addEventListener('input', () => { thicknessValue.innerText = parseFloat(thicknessSlider.value).toFixed(1) + 'mm'; triggerGeneration(); });
        baseThicknessSlider.addEventListener('input', () => { baseThicknessValue.innerText = parseFloat(baseThicknessSlider.value).toFixed(1) + 'mm'; triggerGeneration(); });
        textThicknessSlider.addEventListener('input', () => { textThicknessValue.innerText = parseFloat(textThicknessSlider.value).toFixed(1) + 'mm'; triggerGeneration(); });
        downloadBtn.addEventListener('click', downloadSTLs);
        
        initThree();
        
        try {
            let fontData = (typeof minhaFonteCustomizada !== 'undefined') ? minhaFonteCustomizada : null;
            if(!fontData) throw new Error("Arquivo da fonte não localizado.");
            
            loadedFont = new THREE.FontLoader().parse(fontData);
            fontCache['chewy'] = loadedFont;
            triggerGeneration();
        } catch(error) {
            showError("Erro ao iniciar fonte principal Chewy.");
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();
            if(renderer && scene && camera) renderer.render(scene, camera);
        }
        animate();
    })();
</script>
