<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KeyForge 3D</title>
    
    <!-- Configurações de PWA para Android e iOS (iPhone) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KeyForge 3D">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><circle cx='35' cy='50' r='18' fill='none' stroke='%2310b981' stroke-width='8'/><path d='M53 50 H85 M70 50 V65 M82 50 V65' stroke='%2310b981' stroke-width='8' stroke-linecap='round'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --surface: #ffffff;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            max-width: 100%;
            position: relative;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }

        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-bottom: 1px solid rgba(5, 150, 105, 0.3);
            z-index: 20;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header p {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        #installAppBtn {
            background: rgba(16, 185, 129, 0.2);
            color: var(--primary-light);
            border: 1px solid var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
            background: rgba(0, 0, 0, 0.2);
            margin: 8px 12px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            cursor: grab;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls-panel {
            background: rgba(30, 41, 59, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(5, 150, 105, 0.3);
            flex-shrink: 0;
            max-height: 56vh;
            overflow-y: auto;
            z-index: 15;
        }

        .controls-panel::-webkit-scrollbar { width: 3px; }
        .controls-panel::-webkit-scrollbar-track { background: var(--border); border-radius: 10px; }
        .controls-panel::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }

        label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .value-display {
            color: var(--primary-light);
            font-weight: 700;
            background: rgba(5, 150, 105, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-dark);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            user-select: text;
            -webkit-user-select: text;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 10px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--surface);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.15); }

        select {
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        select:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 4px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(5, 150, 105, 0.5);
            pointer-events: none;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #error-box {
            background: rgba(239, 68, 68, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(5, 150, 105, 0.15);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            color: var(--primary-light);
            margin-top: 10px;
        }

        .hidden { display: none !important; }

        @media (max-width: 380px) {
            .controls-panel { padding: 12px 12px 16px; max-height: 52vh; }
            .btn-primary { padding: 12px; font-size: 0.85rem; }
            .form-group { margin-bottom: 10px; }
            .form-row { gap: 8px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>

    <!-- Bibliotecas Three.js, Clipper e Suporte a Fontes TTF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/TTFLoader.js"></script>
    <script src="https://unpkg.com/clipper-lib@1.0.0/clipper.js"></script>
    <script src="fonte_customizada.js"></script>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>🔑 KeyForge 3D</h1>
            <p>Gerador de Chaveiros para Impressão 3D</p>
        </div>
        <button id="installAppBtn" class="hidden">📲 Instalar App</button>
    </div>

    <div class="canvas-wrapper">
        <div id="canvas-container"></div>
        <div id="loading" class="overlay-message hidden">
            <div class="spinner"></div>
            <span id="loadingText">Processando Malha 3D...</span>
        </div>
        <div id="error-box" class="overlay-message hidden"></div>
    </div>
    
    <div class="controls-panel">
        <div class="form-row">
            <div class="form-group" style="flex: 1.3;">
                <label>
                    <span>📝 Nome</span>
                    <span class="value-display">máx 20</span>
                </label>
                <input type="text" id="nameInput" value="Chaveiro3D" maxlength="20" autocomplete="off">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>
                    <span>🔤 Fonte</span>
                </label>
                <select id="fontSelect">
                    <option value="chewy">Chewy (Divertida)</option>
                    <option value="montserrat">Montserrat (Moderna)</option>
                    <option value="pacifico">Pacifico (Cursiva)</option>
                    <option value="bungee">Bungee (Gamer/Forte)</option>
                    <option value="helvetiker">Helvetiker (Clássica)</option>
                    <option value="custom_file">📂 Arquivo .TTF/.OTF...</option>
                </select>
                <input type="file" id="customFontInput" accept=".ttf,.otf" class="hidden">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>📏 Comprimento <span id="lengthValue" class="value-display">60mm</span></label>
                <input type="range" id="lengthSlider" min="20" max="150" step="1" value="60">
            </div>
            <div class="form-group">
                <label>🔄 Borda <span id="thicknessValue" class="value-display">1.5mm</span></label>
                <input type="range" id="thicknessSlider" min="0.5" max="3.0" step="0.1" value="1.5">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>📦 Base (Z) <span id="baseThicknessValue" class="value-display">3.0mm</span></label>
                <input type="range" id="baseThicknessSlider" min="1.0" max="6.0" step="0.2" value="3.0">
            </div>
            <div class="form-group">
                <label>✨ Relevo <span id="textThicknessValue" class="value-display">1.5mm</span></label>
                <input type="range" id="textThicknessSlider" min="0.5" max="2.0" step="0.1" value="1.5">
            </div>
        </div>

        <div class="form-group" style="background: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 14px; border: 1px solid rgba(16, 185, 129, 0.2);">
            <label style="color: var(--primary-light); margin-bottom: 8px;">🎨 Tipo de Exportação</label>
            <select id="exportMode">
                <option value="multi">Multicolor (Baixar 2 STLs separados)</option>
                <option value="single">Cor Única (Baixar 1 STL mesclado)</option>
            </select>
        </div>
        
        <button id="downloadBtn" class="btn-primary" disabled>📥 Exportar Arquivo(s)</button>
        <div class="badge">
            <span>🎯</span> Arraste para girar | Dois dedos para zoom
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW falhou:', err));
        });
    }

    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installAppBtn.classList.remove('hidden');
    });

    installAppBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installAppBtn.classList.add('hidden');
            deferredPrompt = null;
        }
    });

    (function(){
        let scene, camera, renderer, controls, baseMesh, textMesh, loadedFont = null, debounceTimer;
        const fontCache = {}; // Guarda as fontes carregadas na memória para troca instantânea
        
        const FONT_URLS = {
            montserrat: { type: 'ttf', url: 'https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.0.8/files/montserrat-latin-black-normal.woff' },
            pacifico:   { type: 'ttf', url: 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/pacifico/Pacifico-Regular.ttf' },
            bungee:     { type: 'ttf', url: 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/bungee/Bungee-Regular.ttf' },
            helvetiker: { type: 'json', url: 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json' }
        };

        const nameInput = document.getElementById('nameInput');
        const fontSelect = document.getElementById('fontSelect');
        const customFontInput = document.getElementById('customFontInput');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const thicknessSlider = document.getElementById('thicknessSlider');
        const thicknessValue = document.getElementById('thicknessValue');
        const baseThicknessSlider = document.getElementById('baseThicknessSlider');
        const baseThicknessValue = document.getElementById('baseThicknessValue');
        const textThicknessSlider = document.getElementById('textThicknessSlider');
        const textThicknessValue = document.getElementById('textThicknessValue');
        const exportMode = document.getElementById('exportMode');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const errorBox = document.getElementById('error-box');
        
        let isGenerating = false;
        let lastSelectedFont = 'chewy';
        
        function showLoading(show, customMsg = "Processando Malha 3D...") {
            if(show) {
                loadingText.innerText = customMsg;
                loadingDiv.classList.remove('hidden');
                errorBox.classList.add('hidden');
                isGenerating = true;
                downloadBtn.disabled = true;
            } else {
                loadingDiv.classList.add('hidden');
                isGenerating = false;
                if(loadedFont) downloadBtn.disabled = false;
            }
        }
        
        function showError(message) {
            loadingDiv.classList.add('hidden');
            errorBox.innerText = `⚠️ ${message}`;
            errorBox.classList.remove('hidden');
            isGenerating = false;
            downloadBtn.disabled = true;
            setTimeout(() => {
                if(errorBox && !errorBox.classList.contains('hidden')) {
                    errorBox.classList.add('hidden');
                    if(loadedFont) downloadBtn.disabled = false;
                }
            }, 4000);
        }
        
        function initThree() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.006);
            
            camera = new THREE.PerspectiveCamera(42, width / height, 0.5, 500);
            camera.position.set(0, -50, 60);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.rotateSpeed = 1.2;
            controls.zoomSpeed = 1.0;
            controls.enableZoom = true;
            controls.enablePan = true;
            controls.panSpeed = 0.6;
            controls.touchRotate = true;
            controls.touchZoom = true;
            controls.target.set(0, 0, 2);
            
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.1);
            mainLight.position.set(12, 22, 18);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.PointLight(0x4488cc, 0.45);
            fillLight.position.set(-12, 6, 22);
            scene.add(fillLight);
            
            const backLight = new THREE.PointLight(0xffaa66, 0.35);
            backLight.position.set(6, 12, -18);
            scene.add(backLight);
            
            const rimLight = new THREE.PointLight(0x66ccaa, 0.5);
            rimLight.position.set(-6, 10, -14);
            scene.add(rimLight);
            
            const warmFill = new THREE.PointLight(0xff9966, 0.25);
            warmFill.position.set(8, -5, 10);
            scene.add(warmFill);
            
            const gridHelper = new THREE.GridHelper(120, 20, 0x334155, 0x1e293b);
            gridHelper.position.y = -12;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if(!container || !camera || !renderer) return;
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // Função Auxiliar: Converte qualquer forma (mesmo cursiva sobreposta) em contornos limpos no Clipper
        function extractCleanTextPaths(textShapes, clipperScale) {
            const subjPaths = [];
            textShapes.forEach(shape => {
                const pts = shape.extractPoints(8);
                if (pts.shape && pts.shape.length > 2) {
                    subjPaths.push(pts.shape.map(p => ({ X: Math.round(p.x * clipperScale), Y: Math.round(p.y * clipperScale) })));
                }
                if (pts.holes) {
                    pts.holes.forEach(h => {
                        if (h.length > 2) {
                            subjPaths.push(h.map(p => ({ X: Math.round(p.x * clipperScale), Y: Math.round(p.y * clipperScale) })));
                        }
                    });
                }
            });
            return subjPaths;
        }
        
        async function generateKeychain() {
            if(!loadedFont) {
                showError("Carregando fonte... Aguarde");
                return;
            }
            if(isGenerating) return;
            
            const textStr = nameInput.value.trim();
            if(textStr.length === 0) {
                showError("Digite um nome para o chaveiro");
                return;
            }
            
            showLoading(true, "Processando Malha 3D...");
            await new Promise(r => setTimeout(r, 10));
            
            try {
                errorBox.classList.add('hidden');
                if(baseMesh) { scene.remove(baseMesh); if(baseMesh.geometry) baseMesh.geometry.dispose(); }
                if(textMesh) { scene.remove(textMesh); if(textMesh.geometry) textMesh.geometry.dispose(); }
                
                const clipperScale = 1000;
                const textShapes = loadedFont.generateShapes(textStr, 10);
                if(!textShapes || textShapes.length === 0) throw new Error("Não foi possível gerar formas do texto");
                
                const textOuterPaths = [];
                textShapes.forEach(shape => {
                    const points = shape.extractPoints(8);
                    const path = points.shape.map(p => ({ X: Math.round(p.x * clipperScale), Y: Math.round(p.y * clipperScale) }));
                    textOuterPaths.push(path);
                });
                
                const currentThickness = parseFloat(thicknessSlider.value) || 1.5;
                const offsetDist = currentThickness * clipperScale;
                
                const co = new ClipperLib.ClipperOffset();
                co.AddPaths(textOuterPaths, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
                const offsetPaths = new ClipperLib.Paths();
                co.Execute(offsetPaths, offsetDist);
                
                if(!offsetPaths || offsetPaths.length === 0) throw new Error("Erro no offset. Tente uma borda menor.");
                
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                offsetPaths.forEach(path => path.forEach(p => { 
                    minX = Math.min(minX, p.X); maxX = Math.max(maxX, p.X); 
                    minY = Math.min(minY, p.Y); maxY = Math.max(maxY, p.Y); 
                }));
                
                const ringRadius = 4.8 * clipperScale;
                const holeRadius = 2.6 * clipperScale;
                const cx = minX - holeRadius - 2 * clipperScale;
                const cy = (minY + maxY) / 2;
                
                const ringOuter = [], ringInner = [];
                const segments = 40;
                for(let i = 0; i <= segments; i++) {
                    const a = (i / segments) * Math.PI * 2;
                    ringOuter.push({ X: Math.round(cx + Math.cos(a) * ringRadius), Y: Math.round(cy + Math.sin(a) * ringRadius) });
                    ringInner.push({ X: Math.round(cx + Math.cos(a) * holeRadius), Y: Math.round(cy + Math.sin(a) * holeRadius) });
                }
                
                const cl1 = new ClipperLib.Clipper();
                const unionPaths = new ClipperLib.Paths();
                cl1.AddPaths(offsetPaths, ClipperLib.PolyType.ptSubject, true);
                cl1.AddPaths([ringOuter], ClipperLib.PolyType.ptSubject, true);
                cl1.Execute(ClipperLib.ClipType.ctUnion, unionPaths, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
                
                const cl2 = new ClipperLib.Clipper();
                const finalTree = new ClipperLib.PolyTree();
                cl2.AddPaths(unionPaths, ClipperLib.PolyType.ptSubject, true);
                cl2.AddPaths([ringInner], ClipperLib.PolyType.ptClip, true);
                cl2.Execute(ClipperLib.ClipType.ctDifference, finalTree, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
                
                const getChilds = (node) => (typeof node.Childs === 'function') ? node.Childs() : (node.Childs || []);
                const getContour = (node) => (typeof node.Contour === 'function') ? node.Contour() : (node.Contour || []);
                
                const baseThreeShapes = [];
                const topNodes = getChilds(finalTree);
                if(!topNodes || topNodes.length === 0) throw new Error("Falha na união com argola");
                
                for(let i = 0; i < topNodes.length; i++) {
                    const contour = getContour(topNodes[i]);
                    if(!contour || contour.length < 3) continue;
                    const shape = new THREE.Shape();
                    shape.moveTo(contour[0].X / clipperScale, contour[0].Y / clipperScale);
                    for(let k = 1; k < contour.length; k++) shape.lineTo(contour[k].X / clipperScale, contour[k].Y / clipperScale);
                    
                    const holeNodes = getChilds(topNodes[i]);
                    for(let j = 0; j < holeNodes.length; j++) {
                        const hContour = getContour(holeNodes[j]);
                        if(hContour && hContour.length > 2) {
                            const holePath = new THREE.Path();
                            holePath.moveTo(hContour[0].X / clipperScale, hContour[0].Y / clipperScale);
                            for(let k = 1; k < hContour.length; k++) holePath.lineTo(hContour[k].X / clipperScale, hContour[k].Y / clipperScale);
                            shape.holes.push(holePath);
                        }
                    }
                    baseThreeShapes.push(shape);
                }
                
                if(baseThreeShapes.length === 0) throw new Error("Nenhuma forma base gerada");
                
                const currentBaseThickness = parseFloat(baseThicknessSlider.value) || 3.0;
                const baseDepth = Math.max(0.2, currentBaseThickness - 0.7);
                
                const extrudeSettingsBase = {
                    depth: baseDepth,
                    bevelEnabled: true,
                    bevelThickness: 0.7,
                    bevelSize: 0.55,
                    bevelSegments: 4,
                    curveSegments: 8
                };
                
                const baseGeo = new THREE.ExtrudeGeometry(baseThreeShapes, extrudeSettingsBase);
                
                const currentTextThickness = parseFloat(textThicknessSlider.value) || 1.5;
                const extrudeSettingsText = {
                    depth: currentTextThickness,
                    bevelEnabled: false,
                    curveSegments: 8
                };
                const textGeo = new THREE.ExtrudeGeometry(textShapes, extrudeSettingsText);
                
                baseGeo.computeBoundingBox();
                const originalWidth = baseGeo.boundingBox.max.x - baseGeo.boundingBox.min.x;
                const targetLength = parseFloat(lengthSlider.value) || 60;
                const scaleFactor = targetLength / originalWidth;
                
                baseGeo.scale(scaleFactor, scaleFactor, 1);
                textGeo.scale(scaleFactor, scaleFactor, 1);
                
                textGeo.translate(0, 0, currentBaseThickness);
                
                baseGeo.computeBoundingBox();
                const centerX = -(baseGeo.boundingBox.max.x + baseGeo.boundingBox.min.x) / 2;
                const centerY = -(baseGeo.boundingBox.max.y + baseGeo.boundingBox.min.y) / 2;
                baseGeo.translate(centerX, centerY, 0);
                textGeo.translate(centerX, centerY, 0);
                
                const baseMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x334155, 
                    roughness: 0.45, 
                    metalness: 0.65,
                    emissive: 0x111122,
                    emissiveIntensity: 0.12
                });
                const textMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x10b981, 
                    roughness: 0.35, 
                    metalness: 0.55,
                    emissive: 0x064e3b,
                    emissiveIntensity: 0.08
                });
                
                baseMesh = new THREE.Mesh(baseGeo, baseMaterial);
                textMesh = new THREE.Mesh(textGeo, textMaterial);
                
                baseMesh.castShadow = true;
                textMesh.castShadow = true;
                
                scene.add(baseMesh);
                scene.add(textMesh);
                
                showLoading(false);
                
            } catch(err) {
                console.error("Erro 3D:", err);
                showError(err.message || "Falha na geração. Ajuste os parâmetros.");
                showLoading(false);
            }
        }
        
        async function downloadSTLs() {
            if(!baseMesh || !textMesh || isGenerating) {
                showError("Aguarde o modelo ser gerado");
                return;
            }
            try {
                const exporter = new THREE.STLExporter();
                const safeName = nameInput.value.trim().replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'keyforge';
                const mode = exportMode.value;
                
                downloadBtn.style.transform = 'scale(0.96)';
                setTimeout(() => { downloadBtn.style.transform = ''; }, 120);

                const downloadFileFallback = (stlData, filename) => {
                    const blob = new Blob([stlData], { type: 'application/vnd.ms-pki.stl' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 500);
                };

                if (mode === 'multi') {
                    const stlBase = exporter.parse(baseMesh);
                    const stlText = exporter.parse(textMesh);
                    const fileBaseName = `keyforge_base_${safeName}.stl`;
                    const fileTextName = `keyforge_texto_${safeName}.stl`;

                    const filesArray = [
                        new File([stlBase], fileBaseName, { type: 'application/sla' }),
                        new File([stlText], fileTextName, { type: 'application/sla' })
                    ];

                    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                        try {
                            await navigator.share({
                                files: filesArray,
                                title: `Chaveiro 3D - ${nameInput.value}`,
                                text: 'Arquivos STL gerados no KeyForge 3D'
                            });
                            return;
                        } catch (shareErr) {
                            if (shareErr.name === 'AbortError') return;
                        }
                    }

                    downloadFileFallback(stlBase, fileBaseName);
                    setTimeout(() => {
                        downloadFileFallback(stlText, fileTextName);
                    }, 400);

                } else {
                    const group = new THREE.Group();
                    group.add(baseMesh.clone());
                    group.add(textMesh.clone());
                    const stlMerged = exporter.parse(group);
                    const fileMergedName = `keyforge_unificado_${safeName}.stl`;

                    const filesArray = [new File([stlMerged], fileMergedName, { type: 'application/sla' })];
                    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                        try {
                            await navigator.share({
                                files: filesArray,
                                title: `Chaveiro 3D - ${nameInput.value}`,
                                text: 'Arquivo STL unificado gerado no KeyForge 3D'
                            });
                            return;
                        } catch (shareErr) {
                            if (shareErr.name === 'AbortError') return;
                        }
                    }

                    downloadFileFallback(stlMerged, fileMergedName);
                }
                
            } catch(e) {
                showError("Erro ao exportar STL");
            }
        }
        
        function debouncedGenerate() {
            if(debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => generateKeychain(), 250);
        }
        
        // Gerenciador de troca de fontes (Locais, Remotas e Upload .TTF)
        function switchFont(fontKey) {
            if (fontKey === 'custom_file') {
                customFontInput.click();
                return;
            }

            if (fontCache[fontKey]) {
                loadedFont = fontCache[fontKey];
                lastSelectedFont = fontKey;
                generateKeychain();
                return;
            }

            const fontConfig = FONT_URLS[fontKey];
            if (!fontConfig) return;

            showLoading(true, "Baixando Fonte...");
            const fontLoader = new THREE.FontLoader();

            if (fontConfig.type === 'json') {
                fontLoader.load(fontConfig.url, (font) => {
                    fontCache[fontKey] = font;
                    loadedFont = font;
                    lastSelectedFont = fontKey;
                    showLoading(false);
                    generateKeychain();
                }, undefined, () => {
                    fontSelect.value = lastSelectedFont;
                    showError("Erro ao baixar a fonte selecionada.");
                });
            } else if (fontConfig.type === 'ttf') {
                const ttfLoader = new THREE.TTFLoader();
                ttfLoader.load(fontConfig.url, (json) => {
                    const font = fontLoader.parse(json);
                    fontCache[fontKey] = font;
                    loadedFont = font;
                    lastSelectedFont = fontKey;
                    showLoading(false);
                    generateKeychain();
                }, undefined, () => {
                    fontSelect.value = lastSelectedFont;
                    showError("Erro ao carregar fonte TTF.");
                });
            }
        }

        // Evento quando o usuário escolhe um arquivo .TTF ou .OTF do próprio celular/PC
        customFontInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                fontSelect.value = lastSelectedFont;
                return;
            }
            showLoading(true, "Lendo arquivo de fonte...");
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const ttfLoader = new THREE.TTFLoader();
                    const fontLoader = new THREE.FontLoader();
                    const json = ttfLoader.parse(event.target.result);
                    const font = fontLoader.parse(json);
                    
                    const customKey = 'user_' + file.name;
                    fontCache[customKey] = font;
                    
                    // Adiciona o nome da fonte no menu seletor
                    let opt = document.createElement('option');
                    opt.value = customKey;
                    opt.innerText = "⭐ " + file.name.replace(/\.(ttf|otf)$/i, '');
                    fontSelect.insertBefore(opt, fontSelect.lastElementChild);
                    fontSelect.value = customKey;
                    lastSelectedFont = customKey;

                    loadedFont = font;
                    showLoading(false);
                    generateKeychain();
                } catch (err) {
                    fontSelect.value = lastSelectedFont;
                    showError("Arquivo .TTF/.OTF inválido ou incompatível.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function initFontAndStart() {
            try {
                let fontData = window.minhaFonteCustomizada || (typeof minhaFonteCustomizada !== 'undefined' ? minhaFonteCustomizada : null);
                if(!fontData) throw new Error("Fonte não encontrada. Verifique fonte_customizada.js");
                const loader = new THREE.FontLoader();
                loadedFont = loader.parse(fontData);
                fontCache['chewy'] = loadedFont;
                showLoading(false);
                generateKeychain();
            } catch(error) {
                showError("Erro na fonte: " + error.message);
                console.error(error);
            }
        }
        
        nameInput.addEventListener('input', debouncedGenerate);
        fontSelect.addEventListener('change', (e) => switchFont(e.target.value));
        lengthSlider.addEventListener('input', () => { lengthValue.innerText = lengthSlider.value + 'mm'; debouncedGenerate(); });
        thicknessSlider.addEventListener('input', () => { thicknessValue.innerText = parseFloat(thicknessSlider.value).toFixed(1) + 'mm'; debouncedGenerate(); });
        baseThicknessSlider.addEventListener('input', () => { baseThicknessValue.innerText = parseFloat(baseThicknessSlider.value).toFixed(1) + 'mm'; debouncedGenerate(); });
        textThicknessSlider.addEventListener('input', () => { textThicknessValue.innerText = parseFloat(textThicknessSlider.value).toFixed(1) + 'mm'; debouncedGenerate(); });
        downloadBtn.addEventListener('click', downloadSTLs);
        
        initThree();
        initFontAndStart();
        
        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();
            if(renderer && scene && camera) renderer.render(scene, camera);
        }
        animate();
    })();
</script>
